project_id = "bandfindr"
[api]
enabled = true
port = 55421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55422
shadow_port = 55420
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 55423
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 55424
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
minimum_password_length = 8
enable_signup = true
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
[auth.email]
enabled = true
enable_confirmations = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
[auth.email.template.confirmation]
subject = "Verifikasi akun BandFindr"
content_path = "./supabase/templates/confirmation.html"
[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000
token_refresh = 1000
[storage]
enabled = false
[realtime]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
